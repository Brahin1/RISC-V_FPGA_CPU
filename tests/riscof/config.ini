# RISCOF configuration: rv32im_core (DUT) vs Spike (reference)
#   make -C ../../tb/verilator riscof     # large-memory simulator
#   riscof run --config=config.ini --suite=../riscv-arch-test/riscv-test-suite/rv32i_m \
#              --env=../riscv-arch-test/riscv-test-suite/env --no-browser

[RISCOF]
ReferencePlugin=spike_ref
ReferencePluginPath=spike_ref
DUTPlugin=rv32im_core
DUTPluginPath=rv32im_core

[rv32im_core]
pluginpath=rv32im_core
ispec=rv32im_core/rv32im_core_isa.yaml
pspec=rv32im_core/rv32im_core_platform.yaml
target_run=1
jobs=2

[spike_ref]
pluginpath=spike_ref
jobs=2
